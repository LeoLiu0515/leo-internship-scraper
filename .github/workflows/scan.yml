name: Scan direct-company ATS APIs

on:
  schedule:
    # Runs at 19:30 UTC daily = 3:30am Taipei, ~30min before the main
    # dashboard routine (which runs at 20:00 UTC = 4am Taipei), so its
    # fresh data.json is ready in time to be read.
    - cron: "30 19 * * *"
    # Second daily run at 10:30 UTC = 3:30am Pacific (PDT) so the Asia dashboard routine
    # (11:00 UTC = 4am Pacific) reads data that is ~30 min old. Leo is in Seattle now.
    - cron: "30 10 * * *"
  workflow_dispatch: {} # allows manual trigger from the Actions tab too

permissions:
  contents: write

# Serialize runs so two overlapping triggers can never race on the push.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scraper
        run: python3 scan.py

      # Asia (Taiwan-first) internship scan. continue-on-error so a failure here
      # never blocks the US data.json refresh above.
      - name: Run Asia scraper
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python3 asia_scan.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json asia.json
          git diff --staged --quiet || git commit -m "Update data.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase -X theirs
          git push
